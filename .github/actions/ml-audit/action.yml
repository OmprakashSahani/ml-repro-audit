name: "ML Reproducibility Auditor"
description: "Audit ML repositories for reproducibility and systems quality"

inputs:
  repo-url:
    description: "GitHub repository URL to audit"
    required: true
  version:
    description: "ml-repro-audit package version"
    required: false
    default: "0.1.0"

runs:
  using: "composite"
  steps:
    - name: Install Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install tool
      run: pip install ml-repro-audit==${{ inputs.version }}
      shell: bash

    - name: Run audit
      run: ml-audit ${{ inputs.repo-url }}
      shell: bash
